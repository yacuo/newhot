name: Bug report
description: 报告可复现的问题
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 npm run dev
        2. 打开 /xxx/
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node 版本
      placeholder: 22.x
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图

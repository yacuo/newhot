name: Feature request
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便，为什么需要这个改动
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的做法
      description: 可以描述期望的行为或交互
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
